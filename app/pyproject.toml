[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-api"
version = "1.0.0"
description = "Azure Zero Trust reference API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.143.3", "uvicorn==0.54.0", "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.15.1", "azure-identity==1.26.0",
  "azure-keyvault-secrets==4.11.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1",
  "bandit==1.9.4", "pip-audit==2.10.1", "pip-tools==7.6.2", "httpx2==2.13.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=secure_api --cov-branch --cov-report=term-missing --cov-report=json:reports/coverage.json --cov-fail-under=85"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"src/secure_api/api/routes.py" = ["B008"]
"src/secure_api/core/security.py" = ["B008"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "reports"]
