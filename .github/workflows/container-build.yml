name: Container qualification
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  qualify:
    name: Container qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install locked toolchain
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r app/requirements-dev.lock
          python scripts/install-tools.py trivy syft gitleaks oras
          mkdir -p out .reports
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          cache-binary: false
          buildkitd-flags: '--oci-worker-snapshotter=overlayfs'
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build once with mandatory OCI provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          file: app/Dockerfile
          platforms: linux/amd64
          tags: secure-fastapi:ci
          push: false
          pull: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: |
            type=oci,dest=out/image-layout,tar=false
      - name: Bind OCI graph to source and qualify same config
        run: |
          python scripts/bundle.py prepare out
          python scripts/bundle.py runtime-export out --output "$RUNNER_TEMP/runtime.docker.tar"
          docker load -i "$RUNNER_TEMP/runtime.docker.tar"
          config_digest="$(python -c 'import json; print(json.load(open("out/build.json"))["config_digest"])')"
          bash scripts/validate-docker-runtime.sh secure-fastapi:ci "$config_digest"
      - name: Scan image and every historical layer
        run: |
          .tools/bin/trivy image --scanners vuln,secret --image-config-scanners secret \
            --format json --output .reports/trivy-image.json secure-fastapi:ci
          python scripts/policy.py trivy .reports/trivy-image.json
          python app/scripts/scan_image_layers.py --image secure-fastapi:ci --scanner .tools/bin/gitleaks \
            --config security/gitleaks/layers.gitleaks.toml --report .reports/gitleaks-layers.json \
            --finding-policy security/policies/layer-false-positives.json
      - name: Generate mandatory SBOMs and seal evidence
        run: |
          bash scripts/generate-sbom.sh out
          python -c 'import json; json.dump(dict(runtime=True,image_scan=True,layers_secrets=True,sbom=True),open("out/qualification.json","w"))'
          python scripts/bundle.py seal out
          python scripts/bundle.py verify out
      - name: Sanitize image reports
        id: sanitize
        if: always()
        run: python scripts/sanitize-reports.py
      - name: Preserve image scan reports
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-reports-${{ github.sha }}
          path: .reports/*.json
          include-hidden-files: true
          retention-days: 30
      - name: Preserve immutable qualified candidate
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-candidate-${{ github.sha }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Anchor artifact identity in immutable successful job log
        env:
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          ARTIFACT_SHA: ${{ steps.candidate.outputs.artifact-digest }}
        run: python scripts/github-evidence.py anchor
