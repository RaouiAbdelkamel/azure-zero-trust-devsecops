name: CI Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Python and supply chain gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked dependencies and tools
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r app/requirements-dev.lock
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
          python scripts/install-tools.py gitleaks actionlint trivy
      - name: Validate workflow and dependency policies
        run: bash scripts/validate-ci.sh
      - name: Mandatory security scans
        run: bash scripts/security-checks.sh
      - name: Application tests with coverage
        working-directory: app
        run: python -m pytest --junitxml=reports/pytest.xml
      - name: Sanitize reports even after scan failure
        id: sanitize
        if: always()
        run: python scripts/sanitize-reports.py
      - name: Preserve sanitized security reports
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports-${{ github.sha }}
          path: |
            .reports/*.json
            app/reports/pytest.xml
            app/reports/coverage.json
          include-hidden-files: true
          retention-days: 30
  codeql:
    name: CodeQL analysis gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r app/requirements-dev.lock
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: .reports/codeql
          upload: never
          upload-database: false
      - name: Fail on CodeQL findings
        run: |
          shopt -s nullglob
          files=(.reports/codeql/*.sarif)
          test "${#files[@]}" -gt 0
          for report in "${files[@]}"; do python scripts/policy.py sarif "$report"; done
      - name: Sanitize CodeQL reports
        id: sanitize
        if: always()
        run: python scripts/sanitize-reports.py
      - if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ github.sha }}
          path: .reports/codeql/*.sarif
          include-hidden-files: true
          retention-days: 30
  codeql-upload:
    name: Publish CodeQL on trusted main
    needs: codeql
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-${{ github.sha }}
          path: sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif
  container:
    needs: [quality, codeql]
    uses: ./.github/workflows/container-build.yml
    permissions:
      contents: read
  release-gate:
    name: Release gate
    needs: [quality, codeql, container]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      QUALITY: ${{ needs.quality.result }}
      CODEQL: ${{ needs.codeql.result }}
      CONTAINER: ${{ needs.container.result }}
    steps:
      - name: Reject failed or skipped mandatory jobs
        run: |
          test "$QUALITY" = success
          test "$CODEQL" = success
          test "$CONTAINER" = success
